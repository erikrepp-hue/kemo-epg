name: Build EPG

on:
  schedule:
    # Daily at 10:00 UTC. GitHub may start the job a few minutes late.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build guide
        run: python3 scripts/build_epg.py --refresh

      - name: Commit guide if it changed
        run: |
          set -euo pipefail
          test -s kemo-custom-epg.xml.gz
          gzip -t kemo-custom-epg.xml.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- kemo-custom-epg.xml.gz
          if git diff --cached --quiet -- kemo-custom-epg.xml.gz; then
            echo "EPG unchanged; not committing."
            exit 0
          fi
          staged=$(git diff --cached --name-only)
          if [ "$staged" != "kemo-custom-epg.xml.gz" ]; then
            echo "Refusing to commit unexpected files:"
            printf '%s\n' "$staged"
            exit 1
          fi
          # One tip commit titled "epg" holds the guide. Amending it replaces
          # the gzip blob instead of appending a new copy every day.
          if [ "$(git log -1 --pretty=%s)" = "epg" ]; then
            expected=$(git rev-parse HEAD)
            git commit --amend -m "epg"
            git push --force-with-lease="refs/heads/main:${expected}" origin HEAD:main
          else
            git commit -m "epg"
            git push origin HEAD:main
          fi
